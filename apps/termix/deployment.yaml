apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      initContainers:
        - name: migrate
          image: ghcr.io/jvz-devx/termixkit:main@sha256:87c98156b510bb4d387e3f46e1d026aff4e9b75df5d9fe1c82265c5d62c011ac # {"$imagepolicy": "flux-system:termixkit"}
          imagePullPolicy: IfNotPresent
          command:
            - node
            - scripts/migrate.mjs
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: termixkit-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: termix
          image: ghcr.io/jvz-devx/termixkit:main@sha256:87c98156b510bb4d387e3f46e1d026aff4e9b75df5d9fe1c82265c5d62c011ac # {"$imagepolicy": "flux-system:termixkit"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: termixkit-secrets
                  key: DATABASE_URL
            - name: ORIGIN
              value: https://termix.jensvanzutphen.com
            - name: TERMIXKIT_INSECURE_LOCAL_HTTP
              value: "0"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: termixkit-secrets
                  key: APP_SECRET
            - name: BODY_SIZE_LIMIT
              value: 55M
            - name: CREDENTIAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: termixkit-secrets
                  key: CREDENTIAL_MASTER_KEY
            - name: MICROSOFT_AUTH_ENABLED
              value: "0"
            - name: TERMIXKIT_SSH_KNOWN_HOSTS_PATH
              value: /var/lib/termixkit/ssh-known-hosts.json
            - name: TERMIXKIT_SSH_TRUST_ON_FIRST_USE
              value: "1"
            - name: TERMIXKIT_SSH_ALLOW_PRODUCTION_TOFU
              value: "1"
            - name: GATEWAY_URL
              value: http://termix-gateway:7171
            - name: GATEWAY_PUBLIC_URL
              value: https://termix.jensvanzutphen.com/gateway
            - name: GATEWAY_PROVISIONER_KEY
              valueFrom:
                secretKeyRef:
                  name: termixkit-secrets
                  key: GATEWAY_PROVISIONER_KEY
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/termixkit
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: termixkit-app-data

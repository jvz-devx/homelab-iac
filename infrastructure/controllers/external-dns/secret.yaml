# Cloudflare API token for external-dns. Same token value as the
# cloudflare-api-token Secret in the cert-manager namespace — k8s Secrets
# are namespace-scoped and there's no standard way to share one across
# namespaces, so we keep two encrypted copies.
#
# If you ever rotate the token: update the value in BOTH Secrets (this
# one and infrastructure/controllers/cert-manager/secret.yaml) in the
# same commit. Also refresh /etc/nixos/secrets/common.yaml if the `cf`
# CLI there should follow.

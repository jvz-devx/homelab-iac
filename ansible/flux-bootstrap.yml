---
# Standalone FluxCD bootstrap (use when k3s is already running)
# Usage: ansible-playbook flux-bootstrap.yml

- name: Bootstrap Cilium CNI + FluxCD
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    sops_secrets: "{{ lookup('community.sops.sops', 'group_vars/all.sops.yml') | from_yaml }}"
    github_token: "{{ sops_secrets.github_token }}"
    cloudflare_api_token: "{{ sops_secrets.cloudflare_api_token }}"
    cloudflare_tunnel_token: "{{ sops_secrets.cloudflare_tunnel_token }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_output_path | default(playbook_dir ~ '/../kubeconfig') }}"
    SOPS_AGE_KEY_FILE: "{{ lookup('env', 'HOME') }}/.config/sops/age/keys.txt"
  roles:
    - flux_bootstrap

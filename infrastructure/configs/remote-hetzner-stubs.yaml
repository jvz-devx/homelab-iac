apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv-web
  namespace: remote-hetzner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    external-dns.alpha.kubernetes.io/target: f4f59044-cc55-41f0-a76a-96fdfeb42dc9.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: cv.tunetap.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv-web
                port:
                  number: 3000
    - host: cv.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv-web
                port:
                  number: 3000
  tls:
    - hosts:
        - cv.tunetap.xyz
        - cv.jensvanzutphen.com
      secretName: cv-web-tls

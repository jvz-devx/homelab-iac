---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-aiostreams
  namespace: cloudflared
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-aiostreams
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-aiostreams
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.0@sha256:ba461b8aa9c042156dbd39c38657fe7431bafa063220eab8d5330a523863da9f
          args:
            - tunnel
            - --no-autoupdate
            - --metrics=0.0.0.0:2000
            - --edge-ip-version=4
            - --protocol=http2
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiostreams-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

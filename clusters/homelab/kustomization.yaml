---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system/gotk-components.yaml
  - flux-system/gotk-sync.yaml
  - infrastructure.yaml
  - apps.yaml
  - image-automation.yaml
# Every Flux controller runs a single replica, so leader election only costs:
# six leases renewed every ~5 s were over half of all writes to k3s's SQLite
# datastore, whose compaction had fallen 2.2M revisions behind and kept
# k3s-server busy. The later flag overrides the one in gotk-components.yaml;
# maxSurge 0 stops the old pod before the new one starts, so two instances of
# a controller never run at once (Recreate clashes with the defaulted
# rollingUpdate fields on the live Deployments).
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=flux
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-leader-election=false
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

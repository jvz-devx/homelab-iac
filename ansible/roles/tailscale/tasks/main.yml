---
- name: Validate Tailscale role inputs
  ansible.builtin.assert:
    that:
      - tailscale_auth_key is defined
      - tailscale_auth_key | length > 0
      - tailscale_hostname is defined
      - tailscale_hostname | length > 0
      - tailscale_advertise_routes is defined
      - tailscale_advertise_routes | length > 0
    fail_msg: "tailscale_auth_key, tailscale_hostname, and tailscale_advertise_routes are required."
  no_log: true

- name: Install Tailscale apt prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Install Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Configure Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present
    update_cache: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable IPv4 and IPv6 forwarding for subnet routing
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop:
    - {key: "net.ipv4.ip_forward", value: "1"}
    - {key: "net.ipv6.conf.all.forwarding", value: "1"}

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Configure new Tailscale node
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ tailscale_hostname }}
    --accept-routes={{ tailscale_accept_routes | default(true) | ternary('true', 'false') }}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | default(false) | ternary('true', 'false') }}
    --timeout=60s
  when: tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != "Running"
  changed_when: true
  no_log: true

- name: Reconcile Tailscale node preferences
  ansible.builtin.command: >-
    tailscale set
    --hostname={{ tailscale_hostname }}
    --accept-routes={{ tailscale_accept_routes | default(true) | ternary('true', 'false') }}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | default(false) | ternary('true', 'false') }}
  when: tailscale_status.rc == 0 and (tailscale_status.stdout | from_json).BackendState == "Running"
  changed_when: false
  no_log: true

- name: Install explicit cross-cluster route helper
  ansible.builtin.copy:
    dest: /usr/local/sbin/tailscale-cross-cluster-routes
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      {% for route in tailscale_static_routes | default([]) %}
      ip route replace {{ route }} dev tailscale0
      {% endfor %}
  when: tailscale_static_routes | default([]) | length > 0

- name: Install explicit cross-cluster route service
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscale-cross-cluster-routes.service
    mode: "0644"
    content: |
      [Unit]
      Description=Install explicit Tailscale cross-cluster routes
      Wants=tailscaled.service
      After=tailscaled.service network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/tailscale-cross-cluster-routes
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: tailscale_static_routes | default([]) | length > 0

- name: Enable explicit cross-cluster route service
  ansible.builtin.systemd:
    name: tailscale-cross-cluster-routes
    enabled: true
    daemon_reload: true
    state: started
  when: tailscale_static_routes | default([]) | length > 0

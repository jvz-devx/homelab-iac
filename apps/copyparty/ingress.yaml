---
# Traffic model: public via Cloudflare Tunnel.
#   DNS: files.jensvanzutphen.com → CNAME to <tunnel>.cfargotunnel.com (proxied).
#   Reachable from anywhere on the internet; Cloudflare terminates TLS at
#   its edge, then tunnels to this Ingress inside the cluster.
#   TLS on the Ingress: Let's Encrypt via HTTP-01 (letsencrypt-production).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty
  namespace: copyparty
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: files.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  number: 80
  tls:
    - hosts:
        - files.jensvanzutphen.com
      secretName: copyparty-tls

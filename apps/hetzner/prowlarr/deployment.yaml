---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      annotations:
        app.kubernetes.io/rollout-revision: "2026-07-01-update"
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      initContainers:
        - name: restore-gate
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - |
              set -e
              while [ ! -f /config/config.xml ]; do
                if [ -f /config/prowlarr-config-coolify.tgz ]; then
                  tar -xzf /config/prowlarr-config-coolify.tgz -C /config
                  rm -f /config/prowlarr-config-coolify.tgz
                  chown -R 911:911 /config
                else
                  echo "Waiting for Prowlarr config restore at /config/prowlarr-config-coolify.tgz"
                  sleep 5
                fi
              done
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 9696
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: sveltekit
  namespace: klavier-dev
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: klavier-dev-hetzner
spec:
  selector:
    app.kubernetes.io/name: sveltekit
    app.kubernetes.io/part-of: klavier-dev
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: klavier-dev
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: klavier-ws-hetzner
spec:
  selector:
    app.kubernetes.io/name: websocket
    app.kubernetes.io/part-of: klavier-dev
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP

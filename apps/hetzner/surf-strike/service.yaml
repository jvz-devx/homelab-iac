---
# Reached only by cloudflared (hetzner-aiostreams tunnel) for
# surf-test.jensvanzutphen.com; see terraform/cloudflare/main.tf.
apiVersion: v1
kind: Service
metadata:
  name: surf-strike
  namespace: surf-strike
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: surf-strike
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

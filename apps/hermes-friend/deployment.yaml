---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-friend
  namespace: hermes-friend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-friend
  template:
    metadata:
      labels:
        app: hermes-friend
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              mkdir -p /opt/data/workspace
              cp /config/config.yaml /opt/data/config.yaml
              chown -R 10000:10000 /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - sh
            - -lc
            - |
              mkdir -p /opt/data/workspace
              cp /config/config.yaml /opt/data/config.yaml
              exec /opt/hermes/.venv/bin/hermes gateway run
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: hermes-friend-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-friend-data
        - name: config
          configMap:
            name: hermes-friend-config

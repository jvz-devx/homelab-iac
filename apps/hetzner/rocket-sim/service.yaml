---
# Reached only by cloudflared (hetzner-aiostreams tunnel) for
# rocket.jensvanzutphen.com; see terraform/cloudflare/main.tf.
apiVersion: v1
kind: Service
metadata:
  name: rocket-sim
  namespace: rocket-sim
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rocket-sim
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

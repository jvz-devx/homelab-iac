---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: librechat
  namespace: librechat
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/danny-avila/librechat-chart
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: librechat
spec:
  interval: 24h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat-postgresql
  namespace: librechat
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "18.6.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: librechat
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: ConfigMap
              name: librechat-librechat-configenv
            patch: |-
              - op: remove
                path: /data/CREDS_KEY
              - op: remove
                path: /data/CREDS_IV
              - op: remove
                path: /data/JWT_SECRET
              - op: remove
                path: /data/JWT_REFRESH_SECRET
  values:
    global:
      security:
        allowInsecureImages: true
    fullnameOverride: librechat-postgresql
    image:
      registry: ghcr.io
      repository: bat-bs/bitnami-pgvector
      tag: pg16
    auth:
      database: librechat-vectordb
      existingSecret: librechat-vectordb
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
        replicationPasswordKey: replication-password
    primary:
      persistence:
        enabled: true
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: librechat
spec:
  interval: 30m
  dependsOn:
    - name: librechat-postgresql
  chart:
    spec:
      chart: librechat
      version: "2.0.2"
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: librechat
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      librechat:
        existingSecretName: librechat-credentials-env
        existingSecretApiKey: RAG_OPENAI_API_KEY

    librechat:
      existingSecretName: librechat-credentials-env
      configEnv:
        DOMAIN_CLIENT: https://chat-test.jensvanzutphen.com
        DOMAIN_SERVER: https://chat-test.jensvanzutphen.com
        TRUST_PROXY: "1"
        ENDPOINTS: custom
        ALLOW_EMAIL_LOGIN: "false"
        ALLOW_REGISTRATION: "false"
        ALLOW_SOCIAL_LOGIN: "true"
        ALLOW_SOCIAL_REGISTRATION: "true"
        GOOGLE_CALLBACK_URL: /oauth/google/callback
        NO_INDEX: "true"
      configYamlContent: |
        version: 1.3.5
        cache: true
        registration:
          socialLogins:
            - google
        endpoints:
          custom:
            - name: CLIProxyAPI
              apiKey: "${CLIPROXYAPI_API_KEY}"
              baseURL: "http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1"
              models:
                default:
                  - gpt-5-codex
                fetch: true
              titleConvo: true
              titleModel: gpt-5-codex
              modelDisplayLabel: CLIProxyAPI
      imageVolume:
        enabled: true
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    librechat-rag-api:
      enabled: true
      rag:
        replicaCount: 1
        existingSecret: librechat-credentials-env
        configEnv:
          DB_PORT: "5432"
          EMBEDDINGS_PROVIDER: openai
          RAG_OPENAI_BASEURL: https://openrouter.ai/api/v1
          EMBEDDINGS_MODEL: google/gemini-embedding-2-preview
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 30
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
      postgresql:
        enabled: false
        auth:
          existingSecret: librechat-vectordb
          secretKeys:
            userPasswordKey: postgres-password
            adminPasswordKey: postgres-password
            replicationPasswordKey: postgres-password

    mongodb:
      enabled: true
      auth:
        enabled: false
      databases:
        - LibreChat
      persistence:
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 768Mi

    meilisearch:
      enabled: true
      persistence:
        enabled: true
        storageClass: ""
        size: 10Gi
      auth:
        existingMasterKeySecret: librechat-credentials-env
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi

    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          size: 8Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

    service:
      type: ClusterIP
      port: 3080
      targetPort: 3080
      containerPort: 3080

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-dns01
        external-dns.alpha.kubernetes.io/target: f4f59044-cc55-41f0-a76a-96fdfeb42dc9.cfargotunnel.com
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
      hosts:
        - host: chat-test.jensvanzutphen.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - chat-test.jensvanzutphen.com
          secretName: librechat-tls

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

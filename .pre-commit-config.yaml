repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: >-
          (?x)^(
            infrastructure/controllers/(cert-manager|cloudflared|nas)/secret\.yaml|
            apps/copyparty/secret\.yaml|
            (infrastructure/configs|apps/cv-web)/ghcr-auth-secret\.yaml|
            ansible/group_vars/all\.sops\.yml
          )$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        exclude: >-
          (?x)^(
            infrastructure/controllers/(cert-manager|cloudflared|nas)/secret\.yaml|
            apps/copyparty/secret\.yaml|
            (infrastructure/configs|apps/cv-web)/ghcr-auth-secret\.yaml|
            ansible/group_vars/all\.sops\.yml
          )$

  - repo: local
    hooks:
      - id: sops-check
        name: Check SOPS files are encrypted
        entry: scripts/hooks/sops-check.sh
        language: script
        files: (secret\.yaml$|\.sops\.(yml|yaml)$)

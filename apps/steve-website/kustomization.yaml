---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ghcr-auth-secret.yaml
  - secret.yaml
  - pvc.yaml
  - postgres.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Priority 1: runs on the N100 (k3s-node), postgres and its volume too. See docs/nodes.md.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-node

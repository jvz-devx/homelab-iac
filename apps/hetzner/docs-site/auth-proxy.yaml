---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site-auth
  namespace: docs-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-site-auth
  template:
    metadata:
      labels:
        app: docs-site-auth
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: docs-site-auth-proxy
        - name: auth
          secret:
            secretName: docs-site-basic-auth
---
apiVersion: v1
kind: Service
metadata:
  name: docs-site-auth
  namespace: docs-site
spec:
  type: ClusterIP
  selector:
    app: docs-site-auth
  ports:
    - name: http
      port: 80
      targetPort: http

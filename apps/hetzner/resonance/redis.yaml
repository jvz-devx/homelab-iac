---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resonance-redis
  namespace: resonance
spec:
  replicas: 0
  selector:
    matchLabels:
      app: resonance-redis
  template:
    metadata:
      labels:
        app: resonance-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: resonance-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resonance
spec:
  selector:
    app: resonance-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

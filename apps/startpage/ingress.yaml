---
# Two names, neither through the Cloudflare Tunnel: the page has no login and
# shows the agenda and the backyard camera, so it must stay private.
#
# start.jensvanzutphen.com: tailnet. An unproxied A record to Traefik's tailnet
#   device (traefik-homelab, infrastructure/controllers/traefik/
#   tailnet-service.yaml), like romm. Works on any Tailscale device, at home
#   or away. That device's IP can change if its Service is recreated.
# start-lan.jensvanzutphen.com: LAN. No target annotation, so external-dns
#   uses the Traefik LB address (192.168.1.41). For devices at home without
#   Tailscale.
#
# TLS for both: Let's Encrypt via DNS-01 (cert-manager letsencrypt-dns01), so
# no inbound HTTP from the ACME server is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startpage
  namespace: startpage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/target: 100.90.157.57
spec:
  ingressClassName: traefik
  rules:
    - host: start.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: startpage
                port:
                  number: 3000
  tls:
    - hosts:
        - start.jensvanzutphen.com
      secretName: startpage-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startpage-lan
  namespace: startpage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  ingressClassName: traefik
  rules:
    - host: start-lan.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: startpage
                port:
                  number: 3000
  tls:
    - hosts:
        - start-lan.jensvanzutphen.com
      secretName: startpage-lan-tls

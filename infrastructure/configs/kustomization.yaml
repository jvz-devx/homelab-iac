---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # MetalLB CRD resources (requires MetalLB HelmRelease to be ready)
  - metallb-config.yaml
  # cert-manager ClusterIssuer (requires cert-manager HelmRelease to be ready)
  - clusterissuer.yaml
  # GHCR authentication for Flux image scanning
  - ghcr-auth-secret.yaml
  # Explicit remote-service stubs reached over Tailscale
  - remote-hetzner-stubs.yaml

---
# Public OpenAI-compatible API endpoint for clients that reject private DNS
# targets. Cloudflare proxies this hostname to the existing homelab tunnel,
# which forwards to Traefik inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi-public
  namespace: cliproxyapi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    external-dns.alpha.kubernetes.io/target: f4f59044-cc55-41f0-a76a-96fdfeb42dc9.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: public-chat-api.jensvanzutphen.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
  tls:
    - hosts:
        - public-chat-api.jensvanzutphen.com
      secretName: cliproxyapi-public-tls

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CNI
  - cilium/namespace.yaml
  - cilium/helmrelease.yaml
  # Load balancer
  - metallb/namespace.yaml
  - metallb/helmrelease.yaml
  # Ingress
  - traefik/namespace.yaml
  - traefik/helmrelease.yaml
  # Certificate management
  - cert-manager/namespace.yaml
  - cert-manager/helmrelease.yaml
  - cert-manager/secret.yaml
  # DNS record automation (Cloudflare)
  - external-dns/namespace.yaml
  - external-dns/secret.yaml
  - external-dns/helmrelease.yaml
  # NAS storage
  - nas/namespace.yaml
  - nas/secret.yaml
  - nas/deployment.yaml

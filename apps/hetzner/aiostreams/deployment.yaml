---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiostreams
  namespace: aiostreams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiostreams
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiostreams
    spec:
      containers:
        - name: aiostreams
          image: ghcr.io/viren070/aiostreams:v2.33.2@sha256:b169ccfb2b6f351f1bc5a8a460e4e102db77a11fb4fc58222e411d96b3adb85b
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: https://aiostreams.tunetap.xyz
            - name: DATABASE_URI
              value: sqlite://./data/db.sqlite
            - name: DISK_CACHE_DIR
              value: /app/cache
            - name: USENET_PERFORMANCE_PROFILE
              value: custom
            - name: USENET_SEGMENT_DISK_CACHE_BYTES
              value: "8000000000"
            - name: USENET_VERIFY_MODE
              value: census
            - name: USENET_VERIFY_BUDGET_MS
              value: "5000"
            - name: USENET_DAMAGE_POLICY
              value: strict
            - name: USENET_MATROSKA_HOLE_FILL
              value: "true"
            - name: USENET_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: USENET_PROVIDERS
            - name: TZ
              value: Europe/Amsterdam
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            - name: FETCH_TRAKT_ALIASES
              value: "false"
            - name: COMET_URL
              value: '["http://comet.comet.svc.cluster.local:8000"]'
            - name: DEFAULT_COMET_TIMEOUT
              value: "10000"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: SECRET_KEY
            - name: AIOSTREAMS_AUTH
              valueFrom:
                secretKeyRef:
                  name: aiostreams-secrets
                  key: AIOSTREAMS_AUTH
            - name: AIOSTREAMS_AUTH_ADMINS
              value: jens
            - name: AIOSTREAMS_AUTH_PROXY
              value: jens
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: aiostreams-data
              mountPath: /app/data
            - name: aiostreams-cache
              mountPath: /app/cache
      volumes:
        - name: aiostreams-data
          persistentVolumeClaim:
            claimName: aiostreams-data
        - name: aiostreams-cache
          persistentVolumeClaim:
            claimName: aiostreams-cache

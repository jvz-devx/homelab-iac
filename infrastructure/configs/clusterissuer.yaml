---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@jensvanzutphen.com
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# DNS-01 via Cloudflare — required for LAN-only services (e.g. termix) whose
# ingress isn't reachable from the public internet. Uses the same LE prod
# endpoint as the HTTP-01 issuer above; the solver just proves ownership by
# writing a TXT record via the Cloudflare API instead of serving a token over
# HTTP. cert-manager auto-renews at ~2/3 of cert lifetime without any further
# configuration.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@jensvanzutphen.com
    privateKeySecretRef:
      name: letsencrypt-dns01
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              namespace: cert-manager
              key: api-token
        selector:
          dnsZones:
            - jensvanzutphen.com

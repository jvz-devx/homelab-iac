---
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.1.202
          ansible_user: root

    k3s_cluster:
      children:
        master:
          hosts:
            k3s-node:
              ansible_host: 192.168.1.100
              ansible_user: root
              k3s_role: server

    # Worker nodes live in their own groups so site.yml (which creates LXC 101
    # on every `proxmox` host and makes every `k3s_cluster` host the Tailscale
    # subnet router) never touches them. Provision with k3s-worker.yml.
    proxmox_workers:
      hosts:
        pve-node1:
          ansible_host: 192.168.1.201
          ansible_user: root

    k3s_agents:
      hosts:
        k3s-worker-1:
          ansible_host: 192.168.1.101
          ansible_user: root
          k3s_role: agent

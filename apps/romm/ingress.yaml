# Tailnet-only: https://romm.zebu-dorian.ts.net, served by the Tailscale
# operator with a Tailscale-issued certificate. Not exposed via Cloudflare.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romm
  namespace: romm
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: romm
      port:
        number: 8080
  tls:
    - hosts:
        - romm

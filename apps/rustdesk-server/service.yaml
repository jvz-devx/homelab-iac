---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-server-tcp
  namespace: rustdesk-server
  annotations:
    metallb.universe.tf/allow-shared-ip: "rustdesk"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.112
  externalTrafficPolicy: Local
  selector:
    app: rustdesk-server
  ports:
    - name: id-nat
      port: 21115
      targetPort: 21115
      protocol: TCP
    - name: hbbs
      port: 21116
      targetPort: 21116
      protocol: TCP
    - name: hbbr
      port: 21117
      targetPort: 21117
      protocol: TCP
    - name: web-hbbs
      port: 21118
      targetPort: 21118
      protocol: TCP
    - name: web-hbbr
      port: 21119
      targetPort: 21119
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-server-udp
  namespace: rustdesk-server
  annotations:
    metallb.universe.tf/allow-shared-ip: "rustdesk"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.112
  externalTrafficPolicy: Local
  selector:
    app: rustdesk-server
  ports:
    - name: hbbs-udp
      port: 21116
      targetPort: 21116
      protocol: UDP

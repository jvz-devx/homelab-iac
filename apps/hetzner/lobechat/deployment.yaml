---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobechat
  namespace: lobechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lobechat
      app.kubernetes.io/part-of: lobechat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobechat
        app.kubernetes.io/part-of: lobechat
    spec:
      containers:
        - name: lobechat
          image: lobehub/lobehub:2.1.55
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: lobechat-secrets
          env:
            - name: PORT
              value: "3210"
            - name: LOBE_PORT
              value: "3210"
            - name: DATABASE_DRIVER
              value: node
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NEXT_PUBLIC_AUTH_URL
              value: http://lobechat-hetzner
            - name: ENABLED_OPENAI
              value: "1"
            - name: ENABLED_OLLAMA
              value: "0"
            - name: OPENAI_PROXY_URL
              value: http://cliproxyapi.remote-homelab.svc.cluster.local:8317/v1
            - name: OPENAI_MODEL_LIST
              value: -all,+gpt-5-codex
            - name: APP_URL
              value: http://lobechat-hetzner
            - name: INTERNAL_APP_URL
              value: http://localhost:3210
            - name: SSRF_ALLOW_PRIVATE_IP_ADDRESS
              value: "1"
          ports:
            - name: http
              containerPort: 3210
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

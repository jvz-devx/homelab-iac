apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      automountServiceAccountToken: false
      # The Service named "romm" would inject ROMM_PORT=tcp://..., which RomM
      # reads as its own listen port.
      enableServiceLinks: false
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - "[ -f /config/config.yml ] || cp /seed/config.yml /config/config.yml"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-seed
              mountPath: /seed
      containers:
        - name: romm
          image: rommapp/romm:5.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ROMM_BASE_URL
              value: https://romm.jensvanzutphen.com
            - name: ROMM_DB_DRIVER
              value: mariadb
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: ROMM_AUTH_SECRET_KEY
            # Matches games by file hash, no API key needed.
            - name: HASHEOUS_API_ENABLED
              value: "true"
            # The router's FTP server allows only a few connections, and every
            # library read goes through it.
            - name: SCAN_WORKERS
              value: "2"
            - name: WEB_SERVER_CONCURRENCY
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: nas
              mountPath: /romm/library
              subPath: G/Emulation
            - name: resources
              mountPath: /romm/resources
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
            - name: redis
              mountPath: /redis-data
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: romm-nas
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: config
          persistentVolumeClaim:
            claimName: romm-config
        - name: redis
          persistentVolumeClaim:
            claimName: romm-redis
        - name: config-seed
          configMap:
            name: romm-config-seed

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-site-auth-proxy
  namespace: docs-site
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      auth_basic "Docs";
      auth_basic_user_file /etc/nginx/auth/htpasswd;

      location = /healthz {
        auth_basic off;
        return 204;
      }

      location / {
        proxy_pass http://docs-site.docs-site.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

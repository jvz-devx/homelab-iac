---
apiVersion: v1
kind: Namespace
metadata:
  name: remote-hetzner
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api
  namespace: remote-hetzner
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kubernetes-api
  namespace: remote-hetzner
  labels:
    kubernetes.io/service-name: kubernetes-api
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - 10.53.0.1

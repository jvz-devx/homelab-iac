---
apiVersion: v1
kind: Service
metadata:
  name: lobechat
  namespace: lobechat
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: lobechat-hetzner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lobechat
    app.kubernetes.io/part-of: lobechat
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

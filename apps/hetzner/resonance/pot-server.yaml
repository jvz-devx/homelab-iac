---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resonance-pot-server
  namespace: resonance
spec:
  replicas: 0
  selector:
    matchLabels:
      app: resonance-pot-server
  template:
    metadata:
      labels:
        app: resonance-pot-server
    spec:
      containers:
        - name: pot-server
          image: brainicism/bgutil-ytdlp-pot-provider:latest
          ports:
            - containerPort: 4416
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pot-server
  namespace: resonance
spec:
  selector:
    app: resonance-pot-server
  ports:
    - name: http
      port: 4416
      targetPort: http

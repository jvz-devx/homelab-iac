---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sveltekit
  namespace: klavier-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sveltekit
      app.kubernetes.io/part-of: klavier-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sveltekit
        app.kubernetes.io/part-of: klavier-dev
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: sveltekit
          image: ghcr.io/jvz-devx/coolify-klavier-sveltekit@sha256:d7351f92ce5636f74425d25b6438a1782c1fe84af62e7517a835090844d01832
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: klavier-sveltekit-env
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: klavier-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket
      app.kubernetes.io/part-of: klavier-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket
        app.kubernetes.io/part-of: klavier-dev
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: websocket
          image: ghcr.io/jvz-devx/coolify-klavier-websocket@sha256:ffaf94dad0901a8b27805a48c4aa7471fb88919faf05d3dd3c7f36aad380447c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: klavier-websocket-env
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

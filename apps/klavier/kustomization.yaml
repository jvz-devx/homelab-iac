apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ghcr-auth-secret.yaml
  - secret.yaml
  - r2-secret.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - app.yaml
  - ws-server.yaml
  - ingress.yaml
# Priority 2: runs on k3s-worker-1 (node1). See docs/nodes.md.
# postgres's volume lives there too (moved with scripts/move-local-pv.sh).
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-worker-1

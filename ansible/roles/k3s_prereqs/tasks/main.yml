---
# Base OS prerequisites for k3s on Ubuntu LXC

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - open-iscsi
      - nfs-common
      - jq
    state: present

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present
  # br_netfilter may already be compiled into the kernel in LXC environments
  ignore_errors: true

- name: Ensure br_netfilter loads on boot
  ansible.builtin.copy:
    content: "br_netfilter\n"
    dest: /etc/modules-load.d/br_netfilter.conf
    mode: "0644"

- name: Set kernel parameters for k3s
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop:
    - {key: "net.bridge.bridge-nf-call-iptables", value: "1"}
    - {key: "net.bridge.bridge-nf-call-ip6tables", value: "1"}
    - {key: "net.ipv4.ip_forward", value: "1"}

- name: Ensure /dev/kmsg exists (kubelet requirement)
  ansible.builtin.file:
    src: /dev/console
    dest: /dev/kmsg
    state: link
    force: true

- name: Install /dev/kmsg compatibility unit for k3s in LXC
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-kmsg.service
    mode: "0644"
    content: |
      [Unit]
      Description=Provide /dev/kmsg compatibility for k3s in LXC
      DefaultDependencies=no
      Before=k3s.service
      ConditionPathExists=/dev/console

      [Service]
      Type=oneshot
      ExecStart=/bin/ln -sf /dev/console /dev/kmsg
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target

- name: Ensure /dev/kmsg compatibility unit is enabled and started
  ansible.builtin.systemd:
    name: k3s-kmsg
    enabled: true
    state: started
    daemon_reload: true

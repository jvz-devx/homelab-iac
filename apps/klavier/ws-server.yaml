apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: klavier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-server
      app.kubernetes.io/part-of: klavier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-server
        app.kubernetes.io/part-of: klavier
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ws-server
          image: ghcr.io/jvz-devx/klavier.io/ws-server:latest@sha256:931aa3e3522db9e0d10e2a7a4ce3d7c58da256e2590cb37109b12bbf03ae8147 # {"$imagepolicy": "flux-system:klavier-ws-server"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
            # Empty denies every WebSocket upgrade.
            - name: ALLOWED_ORIGINS
              value: https://klavier.jensvanzutphen.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: klavier-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: klavier-secrets
                  key: REDIS_URL
            # Must equal the app's: it verifies the app-issued WebSocket tokens.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: klavier-secrets
                  key: BETTER_AUTH_SECRET
            # Battle results and reference notes go through the app's signed
            # internal API (in-cluster; not via the public ingress).
            - name: APP_INTERNAL_URL
              value: http://app:3000
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: klavier-secrets
                  key: INTERNAL_API_SECRET
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: klavier
spec:
  selector:
    app.kubernetes.io/name: ws-server
    app.kubernetes.io/part-of: klavier
  ports:
    - name: http
      port: 3001
      targetPort: http

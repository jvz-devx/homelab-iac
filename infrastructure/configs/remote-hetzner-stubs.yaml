---
apiVersion: v1
kind: Namespace
metadata:
  name: remote-hetzner
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api
  namespace: remote-hetzner
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kubernetes-api
  namespace: remote-hetzner
  labels:
    kubernetes.io/service-name: kubernetes-api
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - 10.53.0.1
---
apiVersion: v1
kind: Service
metadata:
  name: librechat
  namespace: remote-hetzner
  annotations:
    tailscale.com/tailnet-fqdn: librechat-hetzner.zebu-dorian.ts.net
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: http
      port: 3080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librechat
  namespace: remote-hetzner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    external-dns.alpha.kubernetes.io/target: f4f59044-cc55-41f0-a76a-96fdfeb42dc9.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: chat-test.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librechat
                port:
                  number: 3080
  tls:
    - hosts:
        - chat-test.jensvanzutphen.com
      secretName: librechat-tls

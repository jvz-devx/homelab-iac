---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CNI (replaces flannel)
  - cilium/namespace.yaml
  - cilium/helmrelease.yaml
  # Certificate management
  - cert-manager/namespace.yaml
  - cert-manager/helmrelease.yaml
  # Ingress (replaces traefik)
  - ingress-nginx/namespace.yaml
  - ingress-nginx/helmrelease.yaml
  # Cloudflare Tunnel
  - cloudflared/namespace.yaml
  - cloudflared/deployment.yaml
  - cloudflared/secret.yaml
  # NAS storage
  - nas/namespace.yaml
  - nas/secret.yaml
  - nas/deployment.yaml

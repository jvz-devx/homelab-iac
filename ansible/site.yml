---
# Full declarative provisioning: Proxmox LXC → k3s → Cilium → FluxCD
# Usage: ansible-playbook site.yml
#
# For individual stages, use tags:
#   ansible-playbook site.yml --tags proxmox    # LXC only
#   ansible-playbook site.yml --tags k3s        # k3s only
#   ansible-playbook site.yml --tags tailscale  # Tailscale subnet router only
#   ansible-playbook site.yml --tags flux       # Flux only

- name: "Stage 1: Create LXC container on Proxmox"
  hosts: proxmox
  gather_facts: false
  tags: [proxmox]
  roles:
    - proxmox_lxc

- name: "Stage 2: Prepare k3s node"
  hosts: k3s_cluster
  become: true
  tags: [k3s]
  roles:
    - k3s_prereqs

- name: "Stage 3: Install k3s server"
  hosts: master
  become: true
  tags: [k3s]
  roles:
    - k3s_server

- name: "Stage 4: Configure Tailscale subnet router"
  hosts: k3s_cluster
  become: true
  tags: [tailscale]
  vars_files:
    - group_vars/all.yml
  vars:
    sops_secrets: "{{ lookup('community.sops.sops', 'group_vars/all.sops.yml') | from_yaml }}"
    tailscale_auth_key: "{{ sops_secrets.tailscale_auth_key }}"
  roles:
    - tailscale

- name: "Stage 5: Bootstrap Cilium CNI + FluxCD"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [flux]
  vars_files:
    - group_vars/all.yml
  vars:
    sops_secrets: "{{ lookup('community.sops.sops', 'group_vars/all.sops.yml') | from_yaml }}"
    github_token: "{{ sops_secrets.github_token }}"
    cloudflare_api_token: "{{ sops_secrets.cloudflare_api_token }}"
    cloudflare_tunnel_token: "{{ sops_secrets.cloudflare_tunnel_token }}"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
    SOPS_AGE_KEY_FILE: "{{ lookup('env', 'HOME') }}/.config/sops/age/keys.txt"
  roles:
    - flux_bootstrap

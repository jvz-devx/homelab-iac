apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-web
  namespace: cv-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cv-web
  template:
    metadata:
      labels:
        app: cv-web
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: cv-web
          image: ghcr.io/jvz-devx/cv-web:main-6-957bc2930d84558b39c598518e699c00c8e8f96d # {"$imagepolicy": "flux-system:cv-web"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          securityContext:
            # runAsNonRoot: true  # disabled — cv-web image runs as root
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

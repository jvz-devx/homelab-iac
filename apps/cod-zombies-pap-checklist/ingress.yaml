---
# Traffic model: LAN-only via public DNS.
#   DNS: pap.jensvanzutphen.com -> 192.168.1.110 (Traefik LB, RFC1918).
#   Resolvable from anywhere; reachable only from the LAN/Tailscale path.
#   TLS: Let's Encrypt via DNS-01 (cert-manager letsencrypt-dns01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cod-zombies-pap-checklist
  namespace: cod-zombies-pap-checklist
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  ingressClassName: traefik
  rules:
    - host: pap.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cod-zombies-pap-checklist
                port:
                  number: 3000
  tls:
    - hosts:
        - pap.jensvanzutphen.com
      secretName: cod-zombies-pap-checklist-tls

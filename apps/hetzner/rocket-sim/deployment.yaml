# rocket-sim multiplayer server: the web client and the WebSocket on one
# HTTP port. One persistent world on an RWO volume, so exactly one replica
# and Recreate (two pods would split the players). The universe is saved
# under /data. Public via cloudflared, see service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocket-sim
  namespace: rocket-sim
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rocket-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocket-sim
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # SIGTERM stops the server within about a second.
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rocket-sim
          # Built by GitHub Actions from jvz-devx/rocket-sim branch `release`.
          image: ghcr.io/jvz-devx/rocket-sim:release@sha256:1786f9570476f2d7ec1a4365eacd51795d539de9336e24ac862f0e745e31facd # {"$imagepolicy": "flux-system:rocket-sim"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUBLIC_ORIGIN
              value: https://rocket.jensvanzutphen.com
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: SIM_INTERNAL_PORT
              value: "8790"
            # Cloudflare's edge appends the visitor IP to X-Forwarded-For and
            # cloudflared passes it through: one hop in front of this port.
            - name: SIM_PROXY_HOPS
              value: "1"
            # With the binary protocol, 16 pilots use ~3.4 Mbit/s host upload
            # in normal play.
            - name: SIM_MAX_PILOTS
              value: "16"
            # ~33 Mbit/s hard cap; above it every connection lowers its rate.
            - name: SIM_UPLOAD_BUDGET_KBPS
              value: "4096"
            - name: SIM_SNAPSHOT_HZ
              value: "20"
            - name: SIM_SAVE_PATH
              value: /data/universe.json
            - name: SIM_JOIN_SECRET_FILE
              value: /etc/rocket-sim/join-secret
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: join-secret
              mountPath: /etc/rocket-sim
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /simulation/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /simulation/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              # The new release takes ~1.6-7 ms per tick at 16 pilots.
              cpu: 300m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 384Mi
      volumes:
        - name: join-secret
          secret:
            secretName: rocket-sim-join
            defaultMode: 0440
            items:
              - key: join-secret
                path: join-secret
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: data
          persistentVolumeClaim:
            claimName: rocket-sim-data

---
# Provision an existing Hetzner VM as a second k3s cluster.
# Terraform writes inventory/hetzner.yml.

- name: "Hetzner Stage 1: Prepare k3s node"
  hosts: hetzner_k3s_cluster
  become: true
  tags: [k3s]
  vars_files:
    - group_vars/hetzner.yml
  roles:
    - k3s_prereqs

- name: "Hetzner Stage 2: Install k3s server"
  hosts: hetzner_master
  become: true
  tags: [k3s]
  vars_files:
    - group_vars/hetzner.yml
  roles:
    - k3s_server

- name: "Hetzner Stage 3: Configure Tailscale subnet router"
  hosts: hetzner_k3s_cluster
  become: true
  tags: [tailscale]
  vars_files:
    - group_vars/hetzner.yml
  vars:
    sops_secrets: "{{ lookup('community.sops.sops', 'group_vars/all.sops.yml') | from_yaml }}"
    tailscale_auth_key: "{{ sops_secrets.tailscale_auth_key }}"
  roles:
    - tailscale

- name: "Hetzner Stage 4: Bootstrap Cilium CNI + FluxCD"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [flux]
  vars_files:
    - group_vars/hetzner.yml
  vars:
    sops_secrets: "{{ lookup('community.sops.sops', 'group_vars/all.sops.yml') | from_yaml }}"
    github_token: "{{ sops_secrets.github_token }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_output_path }}"
    SOPS_AGE_KEY_FILE: "{{ lookup('env', 'HOME') }}/.config/sops/age/keys.txt"
  roles:
    - flux_bootstrap

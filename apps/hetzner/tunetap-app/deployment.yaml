---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunetap-app
  namespace: tunetap-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tunetap-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunetap-app
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      initContainers:
        - name: seed-sqlite
          image: ghcr.io/jvz-devx/coolify-tunetap-app@sha256:74eff492e808ddd6e26ee83723c93ce686f992a7b74ef21d9ec2c5d8568fae12
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - |
              set -e
              if [ ! -f /data/database.db ]; then
                cp -a /app/data/. /data/
              fi
          volumeMounts:
            - name: tunetap-data
              mountPath: /data
      containers:
        - name: tunetap-app
          image: ghcr.io/jvz-devx/coolify-tunetap-app@sha256:74eff492e808ddd6e26ee83723c93ce686f992a7b74ef21d9ec2c5d8568fae12
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: file:/app/data/database.db
            - name: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
              value: "true"
            - name: PUPPETEER_EXECUTABLE_PATH
              value: /usr/bin/chromium-browser
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tunetap-data
              mountPath: /app/data
      volumes:
        - name: tunetap-data
          persistentVolumeClaim:
            claimName: tunetap-data

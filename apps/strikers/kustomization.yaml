apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ghcr-auth-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - webtransport-service.yaml
  - ingress.yaml

# Priority 2: runs on k3s-worker-1 (node1). See docs/nodes.md.
# Its volume lives on k3s-worker-1 (moved with scripts/move-local-pv.sh).
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-worker-1

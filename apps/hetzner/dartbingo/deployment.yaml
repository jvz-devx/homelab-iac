---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dartbingo
  namespace: dartbingo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dartbingo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dartbingo
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: dartbingo
          image: ghcr.io/jvz-devx/coolify-dartbingo@sha256:782a9e2582d3197b337393ab20e2508c38d00c4dd18391152e86a91b8f54903b
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi

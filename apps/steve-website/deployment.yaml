apiVersion: apps/v1
kind: Deployment
metadata:
  name: steve-website
  namespace: steve-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: steve-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steve-website
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: steve-website
          image: ghcr.io/jvz-devx/steve-website:main@sha256:1e884dd2305b12e0dae82408d8876cb4bd369ad903b8185a477d4b8cfccb3cbd # {"$imagepolicy": "flux-system:steve-website"}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: ORIGIN
              value: https://steve.jensvanzutphen.com
            - name: PORT
              value: "3000"
            # Behind the Cloudflare Tunnel: the real client IP for sign-in rate limits.
            - name: ADDRESS_HEADER
              value: CF-Connecting-IP
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: steve-website-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: steve-website-secrets
                  key: BETTER_AUTH_SECRET
            # Uploaded images and their WebP variants (admin media library).
            - name: MEDIA_DIR
              value: /app/data/media
            # Purge deleted images from Cloudflare's cache (token: Zone.Cache Purge only).
            - name: CLOUDFLARE_ZONE_ID
              value: 9c95c564e5855e0e653867092d5723a4
            - name: CLOUDFLARE_PURGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: steve-website-secrets
                  key: CLOUDFLARE_PURGE_TOKEN
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          # Give Traefik time to drop this pod from its endpoints before the process
          # stops, so a rollout never answers requests with a 502.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            # Image uploads decode the original once in memory (sharp).
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /app/data/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data

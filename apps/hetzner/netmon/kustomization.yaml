---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# The hash suffix rolls the Deployment whenever server.py changes.
configMapGenerator:
  - name: netmon-server
    namespace: netmon
    files:
      - server.py

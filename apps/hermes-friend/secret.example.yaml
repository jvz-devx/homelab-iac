---
# Copy to secret.yaml, fill values, encrypt with SOPS, then add it to kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-friend-secrets
  namespace: hermes-friend
type: Opaque
stringData:
  # Required for Discord integration:
  DISCORD_BOT_TOKEN: ""
  # Recommended: comma-separated Discord user IDs that may talk to this bot.
  DISCORD_ALLOWED_USERS: ""

  # Required for gateway/webhook auth internals. Generate with: openssl rand -hex 32
  HERMES_GATEWAY_TOKEN: ""

  # Required for the same Codex model setup as this instance.
  # Best path: exec into the pod and run `hermes login --provider openai-codex`,
  # because Codex OAuth normally writes auth.json rather than using an env API key.
  # Keep this section for optional provider/tool secrets:
  OPENROUTER_API_KEY: ""
  FIRECRAWL_API_KEY: ""
  SUPERMEMORY_API_KEY: ""

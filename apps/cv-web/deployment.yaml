---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-web
  namespace: cv-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cv-web
  template:
    metadata:
      labels:
        app: cv-web
    spec:
      containers:
        - name: cv-web
          image: ghcr.io/jvz-devx/cv-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cv-web
  namespace: cv-web
spec:
  selector:
    app: cv-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv-web
  namespace: cv-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: cv.jensvanzutphen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv-web
                port:
                  number: 80
  tls:
    - hosts:
        - cv.jensvanzutphen.com
      secretName: cv-tls

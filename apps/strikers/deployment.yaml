apiVersion: apps/v1
kind: Deployment
metadata:
  name: strikers
  namespace: strikers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strikers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strikers
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-seed
          image: ghcr.io/jvz-devx/strikers-wasm:a7b0c47@sha256:e01109bc808514f529b5e7a06a4f428782c301e01ceb7f598180d2ed68956812
          command: [/bin/sh, -ec]
          args:
            - |
              until test -f /data/.seed-complete && test -s /data/strikers/metadata.sqlite3; do
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: strikers
          image: ghcr.io/jvz-devx/strikers-wasm:a7b0c47@sha256:e01109bc808514f529b5e7a06a4f428782c301e01ceb7f598180d2ed68956812
          imagePullPolicy: IfNotPresent
          env:
            - name: STRIKERS_DATA_DIR
              value: /data/strikers
            - name: STRIKERS_BIND
              value: 0.0.0.0:7878
            - name: STRIKERS_PUBLIC_ORIGIN
              value: https://strikers.jensvanzutphen.com
            - name: STRIKERS_ISO_PATH
              value: /games/strikers.iso
            # WebTransport datagrams for game frames. Browsers reach the public
            # UDP relay on Hetzner (apps/hetzner/strikers-relay), which forwards
            # over Tailscale to the strikers-webtransport Service below. TLS ends
            # here with a self-signed certificate announced over the WebSocket.
            - name: STRIKERS_WEBTRANSPORT_BIND
              value: 0.0.0.0:4433
            - name: STRIKERS_WEBTRANSPORT_URL
              value: https://91.98.43.250:4433/wt
          ports:
            - name: http
              containerPort: 7878
            - name: webtransport
              containerPort: 4433
              protocol: UDP
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /games
              subPath: strikers/source
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strikers-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: steve-website
  namespace: steve-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: steve-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steve-website
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: steve-website
          image: ghcr.io/jvz-devx/steve-website:main@sha256:74a97dfe38a9d1909c6a26fcb40835570070d82662b8e0a4e10b84d7ec656924 # {"$imagepolicy": "flux-system:steve-website"}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: ORIGIN
              value: https://steve.jensvanzutphen.com
            - name: PORT
              value: "3000"
            # Behind the Cloudflare Tunnel: the real client IP for sign-in rate limits.
            - name: ADDRESS_HEADER
              value: CF-Connecting-IP
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: steve-website-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: steve-website-secrets
                  key: BETTER_AUTH_SECRET
            # Uploaded images and their WebP variants (admin media library).
            - name: MEDIA_DIR
              value: /app/data/media
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            # Image uploads decode the original once in memory (sharp).
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /app/data/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data

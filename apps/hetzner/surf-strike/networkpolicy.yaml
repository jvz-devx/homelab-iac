apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surf-strike-ingress
  namespace: surf-strike
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: surf-strike
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-aiostreams
      ports:
        - protocol: TCP
          port: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: startpage
spec:
  # One replica on purpose: the camera still and the status history live in the pod's memory, and the
  # camera can only produce one still at a time.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: startpage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: startpage
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: startpage
          image: ghcr.io/jvz-devx/startpage:main@sha256:02ddf4b1f53356571f4556cedd07b608cb3badadd4f861ebb332811478cd17db # {"$imagepolicy": "flux-system:startpage"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: startpage-env
            # CLIPROXYAPI_URL and CLIPROXYAPI_MANAGEMENT_KEY for the codex pool panel.
            - secretRef:
                name: startpage-cliproxyapi
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            # The page is served under two hostnames, so the app takes its origin from
            # the headers Traefik sets instead of a fixed ORIGIN.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

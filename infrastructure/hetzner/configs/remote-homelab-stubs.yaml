---
apiVersion: v1
kind: Namespace
metadata:
  name: remote-homelab
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api
  namespace: remote-homelab
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 6443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kubernetes-api
  namespace: remote-homelab
  labels:
    kubernetes.io/service-name: kubernetes-api
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 6443
endpoints:
  - addresses:
      - 100.82.208.49
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
  namespace: remote-homelab
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8317
      targetPort: 8317
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: cliproxyapi
  namespace: remote-homelab
  labels:
    kubernetes.io/service-name: cliproxyapi
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8317
endpoints:
  - addresses:
      - 10.42.0.31
